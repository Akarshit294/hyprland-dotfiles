# hypridle decides what happens when I stop touching the laptop.
# Taken from the example that ships in /usr/share/hypr/hypridle.conf.
# Times are in seconds.

general {
    lock_cmd = pidof hyprlock || hyprlock                             # how to lock. Never two lock screens at once.
    before_sleep_cmd = loginctl lock-session                          # lock before sleep, so closing the lid locks too
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})' # screen back on after waking
}

# 10 minutes: dim the screen
listener {
    timeout = 600
    on-timeout = brightnessctl -s set 10
    on-resume = brightnessctl -r
}

# 11 minutes: lock
listener {
    timeout = 660
    on-timeout = loginctl lock-session
}

# 15 minutes: screen off
listener {
    timeout = 900
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

# 30 minutes: sleep
listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
