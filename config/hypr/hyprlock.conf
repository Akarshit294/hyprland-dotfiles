# hyprlock is the lock screen. Super + L locks. So does closing the lid.
# Taken from the example that ships in /usr/share/hypr/hyprlock.conf,
# with the fonts and colours of the rest of this desktop.
# Not in the video: he had no lock screen.

$font = FiraCode Nerd Font

general {
    hide_cursor = true
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

# A blurred picture of whatever was on screen
background {
    monitor =
    path = screenshot
    blur_passes = 3
}

# Password box
input-field {
    monitor =
    size = 20%, 5%
    outline_thickness = 2
    inner_color = rgba(0, 0, 0, 0.0) # no fill

    outer_color = rgba(67e8f9ee) rgba(4f46e5ee) 45deg
    check_color = rgba(84cc16ee) rgba(14b8a6ee) 120deg
    fail_color = rgba(f43f5eee) rgba(ea3838ee) 40deg

    font_color = rgb(212, 212, 212)
    fade_on_empty = false
    rounding = 10

    font_family = $font
    placeholder_text = Password...
    fail_text = $PAMFAIL

    dots_spacing = 0.3

    position = 0, -20
    halign = center
    valign = center
}

# Time
label {
    monitor =
    text = $TIME12
    font_size = 90
    font_family = $font

    position = -30, 0
    halign = right
    valign = top
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    font_size = 25
    font_family = $font

    position = -30, -150
    halign = right
    valign = top
}
